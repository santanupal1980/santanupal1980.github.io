    .tab-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 40px; border-bottom: 2px solid #e2e8f0; }
    .tab { cursor: pointer; padding: 12px 24px; font-weight: 600; color: var(--secondary); border-bottom: 3px solid transparent; transition: 0.3s; margin-bottom: -2px; }
    .tab a { color: inherit; text-decoration: none; }
    .tab.active { border-color: var(--highlight); color: var(--highlight); }
    .tab:hover { color: var(--highlight); }

    .pub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }

    .pub-content { flex-grow: 1; }
    .pub-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: var(--primary); line-height: 1.4; }
    .pub-meta { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 4px; }
    .pub-meta strong { color: var(--text-dark); }

            allPubs = publications[filter] || [];
        }

                        </a>
                    </h3>
                    <p class="pub-meta"><strong>Authors:</strong> ${pub.authors}</p>
                    <p class="pub-meta"><strong>Venue:</strong> ${pub.venue}</p>
                    <p class="pub-meta"><strong>Year:</strong> ${pub.year}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                if(tab.dataset.tab === "Year-wise") return; // Link handled natively via anchor tag
                
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderPublications(tab.dataset.tab);
            });
        });

        // Initial render
        renderPublications('all');
    });
  </script>
</body>
</html>
